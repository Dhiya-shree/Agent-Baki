# ============================================
# Agent Baki - Application Configuration
# ============================================

# Application Information
spring.application.name=agent-baki
server.port=8080

spring.security.user.name=user
spring.security.user.password=pass

# ============================================
# Postgres Database Configuration
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=user
spring.datasource.password=password
spring.datasource.url=jdbc:postgresql://localhost:5433/spring
spring.jpa.properties.hibernate.default_schema=db
# # ============================================
# # H2 Database Configuration
# # ============================================
# spring.datasource.url=jdbc:h2:mem:incidentdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=user
# spring.datasource.password=pass

# # H2 Console Configuration (Development Only)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.h2.console.settings.web-allow-others=false

# ============================================
# JPA / Hibernate Configurationb
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================
# Flyway Database Migration Configuration
# ============================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ============================================
# Thymeleaf Configuration
# ============================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================
# File Storage Configuration
# ============================================
app.storage.base-path=C:/Users

# ============================================
# Microsoft Outlook Configuration
# ============================================
# Enable/Disable Outlook integration
outlook.config.enabled=false

# Azure AD App Registration Details
outlook.client-id=${OUTLOOK_CLIENT_ID:your-client-id}
outlook.client-secret=${OUTLOOK_CLIENT_SECRET:your-client-secret}
outlook.tenant-id=${OUTLOOK_TENANT_ID:your-tenant-id}
outlook.authority=https://login.microsoftonline.com/${outlook.tenant-id}
outlook.scope=https://graph.microsoft.com/.default

# ============================================
# Jira Configuration
# ============================================
# Enable/Disable Jira integration
jira.config.enabled=false

jira.base-url=
jira.username=
jira.api-token=
jira.project-key=KAN

# ============================================
# IBM Watsonx AI Configuration
# ============================================
watsonx.api-key=${WATSONX_API_KEY:your-api-key}
watsonx.project-id=${WATSONX_PROJECT_ID:your-project-id}
watsonx.endpoint=${WATSONX_ENDPOINT:https://us-south.ml.cloud.ibm.com}
watsonx.model-id=ibm/granite-13b-chat-v2
watsonx.max-tokens=500
watsonx.temperature=0.1

# ============================================
# GitHub Configuration
# ============================================
# GitHub Personal Access Token (Generate from: Settings > Developer settings > Personal access tokens)
# Required scopes: repo (for private repos), public_repo (for public repos)
github.username=${GITHUB_USERNAME:your-github-username}
github.token=${GITHUB_TOKEN:your-github-token}
github.api-url=https://api.github.com
github.default-branch=UAT

# ============================================
# Spring AI Configuration (for MCP Support)
# ============================================
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s

# ============================================
# Batch Job Configuration
# ============================================
# Cron expression format: second minute hour day month weekday
# 0 0 */2 * * ? = Every 2 hours at the top of the hour (00:00, 02:00, 04:00, etc.)
batch.reply.cron=0 0 */2 * * ?
batch.reply.enabled=true
batch.reply.page-size=50

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.agent.baki=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file configuration
logging.file.name=logs/agent-baki.log
logging.file.max-size=10MB
logging.file.max-history=30

# ============================================
# Jackson JSON Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# Server Configuration
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# ============================================
# Actuator Configuration (Optional - for monitoring)
# ============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# ============================================
# Development Profile Specific Settings
# ============================================
# To activate: --spring.profiles.active=dev
# Or set environment variable: SPRING_PROFILES_ACTIVE=dev
